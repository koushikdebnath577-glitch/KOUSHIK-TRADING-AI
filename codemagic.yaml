workflows:
  android-workflow:
    name: Koushik Trading AI Android Build

    environment:
      flutter: stable
      groups:
        - default

    scripts:
      - name: Get packages
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
