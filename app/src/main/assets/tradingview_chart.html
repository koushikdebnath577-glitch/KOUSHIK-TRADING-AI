<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TradingView Lightweight Chart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0D1117;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }
        #chart-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #legend {
            position: absolute;
            top: 6px;
            left: 8px;
            z-index: 10;
            font-size: 10px;
            font-family: monospace;
            color: #8B949E;
            pointer-events: none;
            line-height: 14px;
            background: rgba(13, 17, 23, 0.75);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .legend-val {
            font-weight: 600;
        }
        .up { color: #26A69A; }
        .down { color: #EF5350; }
        .neutral { color: #58A6FF; }
    </style>
    <!-- Load local asset first, fallback to CDN -->
    <script src="file:///android_asset/lightweight-charts.js"></script>
    <script>
        if (typeof LightweightCharts === 'undefined') {
            document.write('<script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"><\/script>');
        }
    </script>
</head>
<body>
    <div id="chart-container">
        <div id="legend"></div>
    </div>
    <script>
        let chart = null;
        let candleSeries = null;
        let volumeSeries = null;
        let ema20Series = null;
        let ema50Series = null;
        let vwapSeries = null;
        let priceLines = [];
        let currentLastCandle = null;
        let isReady = false;

        function initChart() {
            if (typeof LightweightCharts === 'undefined') {
                setTimeout(initChart, 50);
                return;
            }

            const container = document.getElementById('chart-container');
            const width = container.clientWidth || window.innerWidth || 360;
            const height = container.clientHeight || window.innerHeight || 300;

            chart = LightweightCharts.createChart(container, {
                width: width,
                height: height,
                layout: {
                    background: { type: 'solid', color: '#0D1117' },
                    textColor: '#8B949E',
                    fontSize: 10,
                    fontFamily: 'monospace, -apple-system, sans-serif'
                },
                grid: {
                    vertLines: { color: 'rgba(255, 255, 255, 0.04)' },
                    horzLines: { color: 'rgba(255, 255, 255, 0.04)' }
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                    vertLine: {
                        color: '#58A6FF',
                        width: 1,
                        style: LightweightCharts.LineStyle.Dashed,
                        labelBackgroundColor: '#161B22'
                    },
                    horzLine: {
                        color: '#58A6FF',
                        width: 1,
                        style: LightweightCharts.LineStyle.Dashed,
                        labelBackgroundColor: '#161B22'
                    }
                },
                rightPriceScale: {
                    borderColor: 'rgba(255, 255, 255, 0.12)',
                    autoScale: true,
                    scaleMargins: {
                        top: 0.08,
                        bottom: 0.16
                    }
                },
                timeScale: {
                    visible: true,
                    timeVisible: true,
                    secondsVisible: false,
                    borderColor: 'rgba(255, 255, 255, 0.12)',
                    fixLeftEdge: false
                },
                handleScroll: {
                    mouseWheel: true,
                    pressedMouseMove: true,
                    horzTouchDrag: true,
                    vertTouchDrag: false
                },
                handleScale: {
                    axisPressedMouseMove: true,
                    mouseWheel: true,
                    pinch: true
                }
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#26A69A',
                downColor: '#EF5350',
                borderVisible: false,
                wickUpColor: '#26A69A',
                wickDownColor: '#EF5350'
            });

            volumeSeries = chart.addHistogramSeries({
                color: '#26A69A',
                priceFormat: { type: 'volume' },
                priceScaleId: ''
            });
            volumeSeries.priceScale().applyOptions({
                scaleMargins: {
                    top: 0.82,
                    bottom: 0
                }
            });

            // Crosshair legend update
            const legendEl = document.getElementById('legend');
            chart.subscribeCrosshairMove(param => {
                if (!param || !param.time || !param.seriesData || !param.seriesData.get(candleSeries)) {
                    updateDefaultLegend();
                    return;
                }
                const data = param.seriesData.get(candleSeries);
                const isUp = data.close >= data.open;
                const change = data.close - data.open;
                const changePct = data.open > 0 ? (change / data.open * 100).toFixed(2) : '0.00';
                legendEl.innerHTML = `O <span class="legend-val ${isUp ? 'up' : 'down'}">${data.open.toFixed(2)}</span> ` +
                    `H <span class="legend-val up">${data.high.toFixed(2)}</span> ` +
                    `L <span class="legend-val down">${data.low.toFixed(2)}</span> ` +
                    `C <span class="legend-val ${isUp ? 'up' : 'down'}">${data.close.toFixed(2)}</span> ` +
                    `<span class="legend-val ${isUp ? 'up' : 'down'}">(${change >= 0 ? '+' : ''}${changePct}%)</span>`;
            });

            window.addEventListener('resize', () => {
                if (chart && container) {
                    chart.applyOptions({
                        width: container.clientWidth,
                        height: container.clientHeight
                    });
                }
            });

            isReady = true;
            if (window.AndroidInterface && window.AndroidInterface.onChartReady) {
                window.AndroidInterface.onChartReady();
            }
        }

        function updateDefaultLegend() {
            const legendEl = document.getElementById('legend');
            if (!currentLastCandle || !legendEl) return;
            const c = currentLastCandle;
            const isUp = c.close >= c.open;
            const change = c.close - c.open;
            const changePct = c.open > 0 ? (change / c.open * 100).toFixed(2) : '0.00';
            legendEl.innerHTML = `O <span class="legend-val ${isUp ? 'up' : 'down'}">${c.open.toFixed(2)}</span> ` +
                `H <span class="legend-val up">${c.high.toFixed(2)}</span> ` +
                `L <span class="legend-val down">${c.low.toFixed(2)}</span> ` +
                `C <span class="legend-val ${isUp ? 'up' : 'down'}">${c.close.toFixed(2)}</span> ` +
                `<span class="legend-val ${isUp ? 'up' : 'down'}">(${change >= 0 ? '+' : ''}${changePct}%)</span>`;
        }

        window.setCandles = function(candleList, volumeList) {
            if (!candleSeries) return;
            if (!candleList || candleList.length === 0) {
                candleSeries.setData([]);
                if (volumeSeries) volumeSeries.setData([]);
                currentLastCandle = null;
                document.getElementById('legend').innerHTML = '';
                return;
            }
            candleSeries.setData(candleList);
            if (volumeSeries && volumeList) {
                volumeSeries.setData(volumeList);
            }
            currentLastCandle = Object.assign({}, candleList[candleList.length - 1]);
            updateDefaultLegend();
            chart.timeScale().fitContent();
        };

        window.updateLiveTick = function(price, timeSec) {
            if (!candleSeries || price <= 0) return;
            const t = (timeSec && timeSec > 0) ? timeSec : (currentLastCandle ? currentLastCandle.time : Math.floor(Date.now() / 1000));
            
            if (!currentLastCandle) {
                currentLastCandle = {
                    time: t,
                    open: price,
                    high: price,
                    low: price,
                    close: price
                };
                candleSeries.update(currentLastCandle);
                updateDefaultLegend();
                return;
            }

            if (t <= currentLastCandle.time) {
                currentLastCandle.high = Math.max(currentLastCandle.high, price);
                currentLastCandle.low = Math.min(currentLastCandle.low, price);
                currentLastCandle.close = price;
                candleSeries.update(currentLastCandle);
            } else {
                currentLastCandle = {
                    time: t,
                    open: currentLastCandle.close,
                    high: Math.max(currentLastCandle.close, price),
                    low: Math.min(currentLastCandle.close, price),
                    close: price
                };
                candleSeries.update(currentLastCandle);
            }
            updateDefaultLegend();
        };

        window.setIndicators = function(ema20Data, ema50Data, vwapData) {
            if (!chart) return;
            if (ema20Data && ema20Data.length > 0) {
                if (!ema20Series) {
                    ema20Series = chart.addLineSeries({ color: '#FFD700', lineWidth: 1.5, title: 'EMA 20' });
                }
                ema20Series.setData(ema20Data);
            } else if (ema20Series) {
                chart.removeSeries(ema20Series);
                ema20Series = null;
            }

            if (ema50Data && ema50Data.length > 0) {
                if (!ema50Series) {
                    ema50Series = chart.addLineSeries({ color: '#FF9800', lineWidth: 1.5, title: 'EMA 50' });
                }
                ema50Series.setData(ema50Data);
            } else if (ema50Series) {
                chart.removeSeries(ema50Series);
                ema50Series = null;
            }

            if (vwapData && vwapData.length > 0) {
                if (!vwapSeries) {
                    vwapSeries = chart.addLineSeries({ color: '#E040FB', lineWidth: 1.5, title: 'VWAP' });
                }
                vwapSeries.setData(vwapData);
            } else if (vwapSeries) {
                chart.removeSeries(vwapSeries);
                vwapSeries = null;
            }
        };

        window.setKeyLevels = function(levels) {
            if (!candleSeries) return;
            if (priceLines && priceLines.length > 0) {
                priceLines.forEach(l => {
                    try { candleSeries.removePriceLine(l); } catch(e) {}
                });
                priceLines = [];
            }
            if (!levels || levels.length === 0) return;
            levels.forEach(lvl => {
                try {
                    const pl = candleSeries.createPriceLine({
                        price: lvl.price,
                        color: lvl.color || '#F59E0B',
                        lineWidth: 1.5,
                        lineStyle: LightweightCharts.LineStyle.Dashed,
                        axisLabelVisible: true,
                        title: lvl.title || ''
                    });
                    priceLines.push(pl);
                } catch(e) {}
            });
        };

        window.fitContent = function() {
            if (chart) chart.timeScale().fitContent();
        };

        window.zoomIn = function() {
            if (chart) {
                const range = chart.timeScale().getVisibleLogicalRange();
                if (range) {
                    const span = range.to - range.from;
                    const delta = span * 0.2;
                    chart.timeScale().setVisibleLogicalRange({ from: range.from + delta, to: range.to - delta });
                }
            }
        };

        window.zoomOut = function() {
            if (chart) {
                const range = chart.timeScale().getVisibleLogicalRange();
                if (range) {
                    const span = range.to - range.from;
                    const delta = span * 0.25;
                    chart.timeScale().setVisibleLogicalRange({ from: range.from - delta, to: range.to + delta });
                }
            }
        };

        document.addEventListener('DOMContentLoaded', initChart);
    </script>
</body>
</html>
